name: Android WILK tests

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-wilk-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-wilk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Test WILK and navigation
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest --stacktrace
