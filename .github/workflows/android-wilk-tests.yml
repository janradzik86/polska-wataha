name: Android WILK tests

on:
  pull_request:
    paths:
      - 'android/app/src/main/java/app/siatka/wilk/**'
      - 'android/app/src/main/java/app/siatka/WilkScreen.kt'
      - 'android/app/src/main/java/app/siatka/MainActivity.kt'
      - 'android/app/src/test/java/app/siatka/wilk/**'
      - 'android/app/build.gradle.kts'
      - '.github/workflows/android-wilk-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Test WILK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace